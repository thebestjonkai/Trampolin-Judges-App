<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kari</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Ansicht 1: Start -->
  <div class="page page-start" id="view-start">
    <button type="button" class="btn-start" id="start">Start Routine</button>
  </div>

  <!-- Ansicht 2: Eingabe -->
  <div class="page" id="view-input" hidden>

    <main class="buttons" id="buttons">
      <button type="button" class="btn" data-value="0">0</button>
      <button type="button" class="btn" data-value="1">1</button>
      <button type="button" class="btn" data-value="2">2</button>
      <button type="button" class="btn" data-value="3">3</button>
      <button type="button" class="btn" data-value="4">4</button>
      <button type="button" class="btn" data-value="5">5</button>
    </main>

    <button type="button" class="btn-finish" id="finish">Finish Routine</button>

  </div>

  <!-- Ansicht 3: Auswertung -->
  <div class="page page-result" id="view-result" hidden>

    <div class="table-wrap">
      <table class="result-table">
        <thead>
          <tr>
            <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
            <th>7</th><th>8</th><th>9</th><th>10</th><th>N</th><th>L</th>
          </tr>
        </thead>
        <tbody>
          <tr id="result-row">
            <td></td><td></td><td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td><td></td><td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="result-actions">
      <button type="button" class="btn-reset" id="reset">Reset</button>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
