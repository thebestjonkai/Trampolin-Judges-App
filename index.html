<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kari</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- View 0: Lock — guards the start screen -->
  <div class="page page-lock" id="view-lock">
    <h1 class="app-title">Kari</h1>

    <form class="lock-card" id="lock-form">
      <label class="lock-label" for="password">Password</label>
      <input type="password" id="password" class="lock-input"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit" class="btn-unlock">Unlock</button>
      <p class="lock-error" id="lock-error">Wrong password</p>
    </form>
  </div>

  <!-- View 1: Start -->
  <div class="page page-start" id="view-start" hidden>
    <h1 class="app-title">Kari</h1>
    <button type="button" class="btn-start" id="start">Start Routine</button>
    <div class="start-actions">
      <button type="button" class="btn-library" id="open-library">Library</button>
      <button type="button" class="btn-guide" id="open-guide">Guide</button>
    </div>
  </div>

  <!-- View 2: Input -->
  <div class="page" id="view-input" hidden>

    <main class="buttons" id="buttons">
      <button type="button" class="btn" data-value="0">0</button>
      <button type="button" class="btn" data-value="1">1</button>
      <button type="button" class="btn" data-value="2">2</button>
      <button type="button" class="btn" data-value="3">3</button>
      <button type="button" class="btn" data-value="4">4</button>
      <button type="button" class="btn" data-value="5">5</button>
    </main>

    <div class="input-actions">
      <button type="button" class="btn" data-value="10">10</button>
      <button type="button" class="btn-finish" id="finish">Finish Routine</button>
    </div>

  </div>

  <!-- View 3: Library -->
  <div class="page page-result" id="view-result" hidden>

    <h1 class="result-title">Library</h1>

    <div class="table-wrap">
      <div class="table-frame">
        <table class="result-table">
          <thead>
            <tr>
              <th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th>
              <th>S6</th><th>S7</th><th>S8</th><th>S9</th><th>S10</th>
              <th>L</th><th>Total</th><th>E:</th>
            </tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>
    </div>

    <div class="result-actions">
      <button type="button" class="btn-lock" id="lock">Lock</button>
      <button type="button" class="btn-reset" id="reset">Reset</button>
      <button type="button" class="btn-add" id="add-routine">Add Routine</button>
      <button type="button" class="btn-next" id="next">Next Routine</button>
      <button type="button" class="btn-delete" id="delete-last">Delete last Routine</button>
    </div>

  </div>

  <!-- View 4: Guide — rendered from USAGE.md / ANLEITUNG.md -->
  <div class="page page-guide" id="view-guide" hidden>

    <header class="guide-bar">
      <button type="button" class="btn-guide-back" id="guide-back">Back</button>
      <div class="guide-langs" role="group" aria-label="Guide language">
        <button type="button" class="btn-lang is-active" data-lang="en">English</button>
        <button type="button" class="btn-lang" data-lang="de">Deutsch</button>
      </div>
    </header>

    <div class="guide-frame">
      <article class="guide-body" id="guide-body"></article>
    </div>

  </div>

  <script src="js/markdown.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
